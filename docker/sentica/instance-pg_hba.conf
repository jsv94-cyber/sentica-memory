# TCP is a password from the certificate proxy on sentica-db only.
# The socket accepts the image user (uid 999, name postgres) as the
# database role sentica. See instance-pg_ident.conf.
local all sentica peer map=sentica
host all all 10.8.0.67/32 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
