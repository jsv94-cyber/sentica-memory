# Test proof. Unix sockets stay open for init and pg_isready.
# TCP is SSL only, and only from the matching PgBouncer address, with a
# password that lives in that proxy's userlist. The instance has no password.
local all all trust
hostssl tenant_a tenant_a 172.28.12.13/32 scram-sha-256
hostssl tenant_b tenant_b 172.28.12.14/32 scram-sha-256
hostssl all all 0.0.0.0/0 reject
host all all 0.0.0.0/0 reject
host all all ::/0 reject
