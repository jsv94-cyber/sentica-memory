# Test proof. Unix sockets stay open for init and pg_isready.
# TCP is accepted only from the two PgBouncer addresses, and only as the
# matching tenant role into that tenant's database.
local all all trust
host tenant_a tenant_a 172.28.12.13/32 trust
host tenant_b tenant_b 172.28.12.14/32 trust
host all all 0.0.0.0/0 reject
host all all ::/0 reject
