[databases]
tenant_a = host=database port=5432 dbname=tenant_a
tenant_b = host=database port=5432 dbname=tenant_b

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = cert
auth_file = /etc/pgbouncer/userlist-a.txt
pool_mode = session
max_client_conn = 50
default_pool_size = 10
client_tls_sslmode = verify-full
client_tls_ca_file = /certs/client-ca.crt
client_tls_cert_file = /certs/pgbouncer-a.crt
client_tls_key_file = /certs/pgbouncer-a.key
server_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits,search_path,options
admin_users = sentica_operator
stats_users = sentica_operator
