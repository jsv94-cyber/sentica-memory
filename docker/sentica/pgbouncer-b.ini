[databases]
tenant_b = host=database port=5432 dbname=tenant_b

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = cert
auth_file = /tmp/userlist.txt
pool_mode = session
max_client_conn = 50
default_pool_size = 10
client_tls_sslmode = verify-full
client_tls_ca_file = /certs/client-ca.crt
client_tls_cert_file = /tmp/proxy.crt
client_tls_key_file = /tmp/proxy.key
server_tls_sslmode = verify-full
server_tls_ca_file = /certs/ca.crt
ignore_startup_parameters = extra_float_digits,search_path,options
admin_users = sentica_operator
stats_users = sentica_operator
