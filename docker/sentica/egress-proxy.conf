# CONNECT to port 443 on the provider hosts, from the model gateway only.
# A hostname must match exactly. Plain HTTP has no allow rule. The last
# rule denies everything else.

visible_hostname sentica-egress
http_port 8443

acl gateway_src src 10.8.0.22/32
acl CONNECT method CONNECT
acl SSL_ports port 443
acl provider_host dstdom_regex -i ^api\.openai\.com\.?$
acl provider_host dstdom_regex -i ^api\.anthropic\.com\.?$
acl provider_host dstdom_regex -i ^generativelanguage\.googleapis\.com\.?$

http_access allow gateway_src CONNECT SSL_ports provider_host
http_access deny all

cache deny all
access_log none
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid/squid.pid
pinger_enable off
dns_nameservers 1.1.1.1
